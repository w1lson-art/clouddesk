<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rich Albums — Premium 3D Photo Albums</title>
<style>
  :root{
    --bg:#0b0712; --bg2:#120a1f; --card:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.12); --txt:#f5f1ff; --muted:#a89cc4;
    --pink:#ff5f9e; --violet:#8b5cf6; --blue:#3b82f6; --gold:#f5c451;
    --radius:22px; --shadow:0 20px 60px -20px rgba(139,92,246,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.28), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(255,95,158,.22), transparent 60%),
      radial-gradient(800px 700px at 50% 120%, rgba(59,130,246,.18), transparent 60%),
      linear-gradient(180deg,#0b0712,#120a1f 60%,#0b0712);
    min-height:100vh;
    padding-bottom:90px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---- top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    background:rgba(11,7,18,.55);
    border-bottom:1px solid var(--stroke);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px}
  .brand .logo{
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(135deg,var(--pink),var(--violet) 60%,var(--blue));
    box-shadow:0 6px 18px -4px rgba(255,95,158,.6), inset 0 1px 0 rgba(255,255,255,.35);
    display:grid;place-items:center;font-size:16px
  }
  .brand span{background:linear-gradient(90deg,#fff,#d9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top-actions{display:flex;gap:8px;align-items:center}
  .icon-btn{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--stroke);
    transition:.2s;font-size:18px
  }
  .icon-btn:active{transform:scale(.94)}

  /* ---- layout ---- */
  .wrap{max-width:760px;margin:0 auto;padding:18px}
  .screen{display:none;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---- glass card ---- */
  .glass{
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
  }

  /* ---- buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    color:#fff;
    box-shadow:0 10px 25px -10px rgba(255,95,158,.7), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .15s ease, box-shadow .2s;
    border:1px solid rgba(255,255,255,.15);
  }
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{
    background:var(--card);color:var(--txt);
    box-shadow:none;border:1px solid var(--stroke);
  }
  .btn.block{width:100%}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  /* ---- avatar ---- */
  .avatar{
    width:44px;height:44px;border-radius:50%;
    overflow:hidden;flex:0 0 auto;background:#2a1f42;
    display:grid;place-items:center;font-weight:800;color:#cbb8ff;font-size:16px;
    border:2px solid rgba(255,255,255,.15);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar.lg{width:96px;height:96px;border-width:3px}
  .avatar.sm{width:32px;height:32px;border-width:2px;font-size:12px}

  /* ---- verified badge ---- */
  .verified{
    display:inline-grid;place-items:center;vertical-align:middle;
    width:15px;height:15px;margin-left:4px;
    background:linear-gradient(135deg,#4aa8ff,#2563eb);
    border-radius:50%;flex:0 0 auto;
    box-shadow:0 0 0 1.5px rgba(11,7,18,.9), 0 2px 6px rgba(37,99,235,.5);
    cursor:pointer;position:relative;
    transform:translateY(1px);
  }
  .verified svg{width:9px;height:9px;fill:#fff}

  /* ---- feed cards ---- */
  .album-card{
    border-radius:26px;overflow:hidden;position:relative;margin-bottom:22px;
    background:#1a1230;border:1px solid var(--stroke);
    transition:transform .25s ease, box-shadow .3s;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9);
  }
  .album-card:hover{transform:translateY(-3px);box-shadow:0 40px 80px -30px rgba(139,92,246,.6)}
  .album-cover{
    aspect-ratio:4/5;width:100%;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#2a1f42,#4a2b6b);display:grid;place-items:center;
  }
  .album-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .album-cover .fname{color:rgba(255,255,255,.35);font-size:13px}
  .album-meta{padding:14px 16px 16px}
  .album-row{display:flex;align-items:center;gap:10px}
  .album-title{font-weight:800;font-size:17px;margin:0;line-height:1.2}
  .album-sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  .album-actions{display:flex;align-items:center;gap:16px;margin-top:12px}
  .like-btn{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;color:var(--txt);padding:6px 4px;border-radius:10px;transition:.2s}
  .like-btn .heart{font-size:18px;transition:transform .2s}
  .like-btn.liked .heart{color:#ff3b6b;transform:scale(1.15)}
  .like-btn:active .heart{transform:scale(.85)}
  .like-count{font-variant-numeric:tabular-nums}
  .share-btn{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}

  /* theme skins applied to album cards */
  .theme-romantic{background:linear-gradient(180deg,#3a1030,#1a0620);border-color:rgba(255,95,158,.4)}
  .theme-minimal{background:#f7f4ee;color:#1a1a1a;border-color:#e5e0d5}
  .theme-minimal .album-sub,.theme-minimal .share-btn{color:#6b6558}
  .theme-minimal .like-btn{color:#1a1a1a}
  .theme-dark{background:#0a0a0f;border-color:#1f1f2e}
  .theme-vintage{background:linear-gradient(180deg,#3a2c1a,#241a10);border-color:rgba(200,160,90,.35)}
  .theme-floral{background:linear-gradient(180deg,#1f2d1f,#0e1a10);border-color:rgba(120,200,120,.3)}
  .theme-modern{background:linear-gradient(135deg,#1a1a2e,#16213e);border-color:rgba(100,120,255,.3)}
  .theme-pastel{background:linear-gradient(180deg,#3a2c3a,#241a2e);border-color:rgba(255,200,220,.3)}
  .theme-gold{background:linear-gradient(135deg,#2a1f08,#1a1004);border-color:rgba(245,196,81,.5)}

  /* ---- inputs ---- */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
  .field input,.field textarea,.field select{
    width:100%;padding:13px 14px;border-radius:14px;
    background:rgba(0,0,0,.3);border:1px solid var(--stroke);
    color:var(--txt);font-size:15px;outline:none;transition:.2s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
  .field textarea{resize:vertical;min-height:80px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}

  /* ---- bottom nav ---- */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;z-index:60;
    display:flex;justify-content:space-around;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
    background:rgba(11,7,18,.75);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border-top:1px solid var(--stroke);
  }
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--muted);font-weight:700;padding:6px 14px;border-radius:12px;transition:.2s;
  }
  .nav-item .ico{font-size:20px;line-height:1}
  .nav-item.active{color:var(--txt)}
  .nav-item.active .ico{filter:drop-shadow(0 0 8px rgba(255,95,158,.8))}

  /* ---- modal ---- */
  .modal-back{
    position:fixed;inset:0;background:rgba(5,3,10,.75);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:18px;
    animation:fade .25s
  }
  .modal-back.show{display:flex}
  .modal{
    width:100%;max-width:440px;max-height:88vh;overflow:auto;
    padding:22px;border-radius:24px;
    background:linear-gradient(180deg,#1a1230,#120a1f);
    border:1px solid var(--stroke);
    box-shadow:0 40px 100px -20px rgba(0,0,0,.9);
    animation:pop .3s cubic-bezier(.2,.8,.3,1.2)
  }
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .modal h2{margin:0 0 6px;font-size:20px}
  .modal p.sub{margin:0 0 18px;color:var(--muted);font-size:13px}

  /* ---- toast ---- */
  .toast-wrap{position:fixed;bottom:100px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{
    padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;
    background:rgba(30,20,50,.95);border:1px solid var(--stroke);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
    animation:toastIn .3s ease;max-width:90%;
  }
  .toast.err{border-color:rgba(255,80,80,.5);color:#ffb3b3}
  .toast.ok{border-color:rgba(80,255,150,.4);color:#b3ffce}
  @keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  /* ---- profile header ---- */
  .profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 18px;gap:10px}
  .profile-head .name{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
  .profile-head .bio{color:var(--muted);font-size:14px;max-width:320px;line-height:1.5}

  /* ---- empty ---- */
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:48px;margin-bottom:12px;opacity:.7}
  .empty h3{color:var(--txt);margin:0 0 8px;font-size:18px}

  /* ---- theme chooser ---- */
  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .theme-opt{
    padding:14px;border-radius:16px;border:2px solid var(--stroke);
    cursor:pointer;transition:.2s;position:relative;overflow:hidden;min-height:78px;
    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .theme-opt.selected{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,158,.25)}
  .theme-opt .tname{font-weight:800;font-size:14px;position:relative;z-index:1}
  .theme-opt .tlock{position:absolute;top:8px;right:8px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:20px;color:var(--gold);font-weight:700;z-index:1}
  .theme-opt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));z-index:0}

  /* ---- crop ---- */
  .crop-stage{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#000;cursor:grab;touch-action:none;margin:0 0 14px}
  .crop-stage img{position:absolute;left:50%;top:50%;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .crop-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);pointer-events:none}

  /* ---- album viewer ---- */
  .viewer{position:fixed;inset:0;z-index:150;background:#05030a;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .viewer.show{display:block;animation:fade .3s}
  .viewer-top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 16px;
    background:linear-gradient(180deg,rgba(5,3,10,.9),transparent);backdrop-filter:blur(10px)}
  .viewer-title{font-weight:800;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer-body{padding:0 16px 120px;max-width:600px;margin:0 auto}
  .photo-item{
    position:relative;margin:0 auto 26px;max-width:100%;
    background:#fff;padding:14px 14px 22px;border-radius:6px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
    transition:transform .3s;
  }
  .photo-item.no-frame{background:transparent;padding:0;box-shadow:none}
  .photo-item img{width:100%;height:auto;display:block;border-radius:2px}
  .photo-item .caption{
    margin-top:12px;text-align:center;color:#333;font-size:14px;line-height:1.5;
    font-family:Georgia,serif;padding:0 4px;
  }
  .photo-item.no-frame .caption{color:var(--txt);font-family:inherit}
  .photo-item .caption .quote{font-style:italic}

  /* music bar */
  .music-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:160;
    display:none;align-items:center;gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(20,12,34,.92);
    backdrop-filter:blur(20px);border-top:1px solid var(--stroke);
  }
  .music-bar.show{display:flex}
  .music-bar .np{flex:1;overflow:hidden}
  .music-bar .np .song{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .music-bar .np .artist{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .music-bar button{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;font-size:16px;color:#fff;box-shadow:0 8px 20px -8px rgba(255,95,158,.8)}

  /* spinner */
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* admin */
  .admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;-webkit-overflow-scrolling:touch}
  .admin-tab{padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid var(--stroke);font-weight:700;font-size:13px;white-space:nowrap;transition:.2s;color:var(--muted)}
  .admin-tab.active{background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-color:transparent}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
  .stat{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--stroke)}
  .stat .num{font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,#d9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .list-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--stroke);margin-bottom:10px}
  .list-row .grow{flex:1;min-width:0}
  .list-row .title{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list-row .meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-btn{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--txt)}
  .mini-btn.danger{border-color:rgba(255,80,80,.5);color:#ffb3b3}
  .mini-btn.good{border-color:rgba(80,255,150,.4);color:#b3ffce}

  /* search bar */
  .search-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--stroke);margin-bottom:16px}
  .search-bar input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px}

  /* intro overlay */
  .intro-ov{position:fixed;inset:0;z-index:180;background:#05030a;display:none;place-items:center;overflow:hidden}
  .intro-ov.show{display:grid}
  .intro-ov .msg{font-size:24px;font-weight:800;text-align:center;padding:20px;line-height:1.4;animation:introIn 2.2s ease forwards;background:linear-gradient(90deg,#fff,#ffb3d9,#cbb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes introIn{0%{opacity:0;transform:scale(.8) translateY(20px)}30%{opacity:1;transform:scale(1.02)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
  .heart-float{position:absolute;font-size:26px;animation:floatUp 3s ease-out forwards;opacity:0}
  @keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-260px) scale(1.2)}}

  /* small */
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .center{text-align:center}
  .mt{margin-top:16px}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  @media(min-width:520px){ .wrap{padding:22px} }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="brand"><div class="logo">✦</div><span>Rich Albums</span></div>
  <div class="top-actions">
    <button class="icon-btn" onclick="openSearch()" aria-label="Search">🔍</button>
    <button class="icon-btn" id="profileBtn" onclick="go('profile')" aria-label="Profile">👤</button>
  </div>
</div>

<!-- ============ SCREENS ============ -->
<div class="wrap">

  <!-- FEED -->
  <section class="screen active" id="scr-feed">
    <div id="feedList"></div>
    <div id="feedEmpty" class="empty hidden">
      <div class="big">🌌</div>
      <h3>No albums yet</h3>
      <p>Be the first to create a beautiful album.</p>
      <button class="btn mt" onclick="go('create')">Create Album</button>
    </div>
  </section>

  <!-- CREATE -->
  <section class="screen" id="scr-create">
    <div id="createBlocked" class="hidden"></div>
    <div id="createForm" class="hidden">
      <h2 style="margin:0 0 4px;font-size:22px">Create your album</h2>
      <p class="muted" style="margin:0 0 20px;font-size:13px">One active album per account.</p>

      <div class="glass" style="padding:18px">
        <div class="field">
          <label>Album name</label>
          <input id="albName" maxlength="40" placeholder="e.g. Our Little Universe" />
        </div>
        <div class="field">
          <label>Public appearance</label>
          <div class="theme-grid" id="themeGrid"></div>
        </div>
        <div class="field">
          <label>Song (optional)</label>
          <select id="albSong">
            <option value="">— No song —</option>
            <option value="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b3e7c.mp3">Soft Piano (Pixabay)</option>
            <option value="https://cdn.pixabay.com/audio/2022/10/25/audio_946bc1e2f9.mp3">Romantic Strings</option>
            <option value="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3">Ambient Dream</option>
            <option value="custom">+ Custom URL</option>
          </select>
          <input id="albSongCustom" class="hidden mt" placeholder="https://… .mp3" />
          <div class="hint">Autoplay may require a tap on mobile.</div>
        </div>
        <div class="field">
          <label>Animated intro (optional)</label>
          <select id="albIntro">
            <option value="">— None —</option>
            <option value="hearts">Floating hearts ❤️</option>
            <option value="welcome">Elegant welcome ✨</option>
            <option value="cinematic">Cinematic fade 🎬</option>
          </select>
        </div>
        <button class="btn block" id="createBtn" onclick="createAlbum()">Create Album</button>
      </div>
    </div>
  </section>

  <!-- PROFILE -->
  <section class="screen" id="scr-profile">
    <div id="profileContent"></div>
  </section>

  <!-- ADMIN -->
  <section class="screen" id="scr-admin">
    <div id="adminContent"></div>
  </section>
</div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="nav-item active" data-nav="feed" onclick="go('feed')"><span class="ico">🏠</span>Feed</button>
  <button class="nav-item" data-nav="create" onclick="go('create')"><span class="ico">➕</span>Create</button>
  <button class="nav-item" data-nav="profile" onclick="go('profile')"><span class="ico">👤</span>Profile</button>
  <button class="nav-item hidden" data-nav="admin" id="navAdmin" onclick="go('admin')"><span class="ico">🛡️</span>Admin</button>
</nav>

<!-- ============ MODAL ============ -->

</div>

<!-- ============ INTRO OVERLAY ============ -->
<div class="intro-ov" id="introOv"></div>

<audio id="audio"></audio>

<script>
/* =========================================================
   STORAGE — persists across refresh/close/reopen
   Keys: ra:users, ra:albums, ra:session, ra:seed
========================================================= */
const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('ra:'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('ra:'+k, JSON.stringify(v)); },
  del(k){ localStorage.removeItem('ra:'+k); }
};

const ADMIN_EMAIL = 'richestwllx@gmail.com';
const THEMES = [
  {id:'romantic', name:'Romantic',     cls:'theme-romantic', free:true},
  {id:'minimal',  name:'Minimal',      cls:'theme-minimal',  free:true},
  {id:'dark',     name:'Dark',         cls:'theme-dark',     free:true},
  {id:'vintage',  name:'Vintage',      cls:'theme-vintage',  free:true},
  {id:'floral',   name:'Floral',       cls:'theme-floral',   free:true},
  {id:'modern',   name:'Modern 3D',    cls:'theme-modern',   free:true},
  {id:'pastel',   name:'Pastel',       cls:'theme-pastel',   free:true},
  {id:'gold',     name:'Gold Special', cls:'theme-gold',     free:false},
];
const themeById = id => THEMES.find(t=>t.id===id) || THEMES[0];

/* ---------- state ---------- */
let state = {
  users:   DB.get('users', []),
  albums:  DB.get('albums', []),
  session: DB.get('session', null),
  likes:   DB.get('likes', []),      // {albumId, userId}
  adminLikes: DB.get('adminLikes', []), // {albumId, count}
  themeReqs: DB.get('themeReqs', []),
  verified: DB.get('verified', []),  // userIds
  verReqs: DB.get('verReqs', []),
  applicationsOpen: DB.get('applicationsOpen', true)
};
function save(){
  DB.set('users', state.users);
  DB.set('albums', state.albums);
  DB.set('session', state.session);
  DB.set('likes', state.likes);
  DB.set('adminLikes', state.adminLikes);
  DB.set('themeReqs', state.themeReqs);
  DB.set('verified', state.verified);
  DB.set('verReqs', state.verReqs);
  DB.set('applicationsOpen', state.applicationsOpen);
}

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity=0; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),320); }, 2400);
}
function currentUser(){ return state.users.find(u=>u.id===state.session) || null; }
function isAdmin(){ const u = currentUser(); return !!u && u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase(); }
function displayName(u){ return u ? (u.displayName || u.username || u.email.split('@')[0]) : 'Unknown'; }
function initial(u){ return (displayName(u)[0]||'?').toUpperCase(); }
function albumOwner(alb){ return state.users.find(u=>u.id===alb.ownerId); }
function likeCount(albId){
  const real = state.likes.filter(l=>l.albumId===albId).length;
  const boost = state.adminLikes.find(a=>a.albumId===albId)?.count || 0;
  return real + boost;
}
function userLiked(albId){
  const u = currentUser(); if(!u) return false;
  return state.likes.some(l=>l.albumId===albId && l.userId===u.id);
}
function isVerified(userId){ return state.verified.includes(userId); }
function verifiedBadge(userId){
  if(!isVerified(userId)) return '';
  return `<span class="verified" onclick="event.stopPropagation();showVerified(event)"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>`;
}
function showVerified(e){
  e.stopPropagation();
  const b = e.currentTarget.getBoundingClientRect();
  toast('✓ Verified by Rich', 'ok');
}
function avatarHTML(u, cls=''){
  if(!u) return `<div class="avatar ${cls}">?</div>`;
  if(u.avatar) return `<div class="avatar ${cls}"><img src="${u.avatar}" alt=""></div>`;
  return `<div class="avatar ${cls}">${esc(initial(u))}</div>`;
}

/* =========================================================
   ROUTING
========================================================= */
function go(screen){
  $$('.screen').forEach(s=>s.classList.remove('active'));
  const el = $('#scr-'+screen);
  if(el) el.classList.add('active');
  $$('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.nav===screen));
  if(screen==='feed') renderFeed();
  if(screen==='create') renderCreate();
  if(screen==='profile') renderProfile();
  if(screen==='admin') renderAdmin();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================
   AUTH
========================================================= */
function requireAuth(cb){
  if(currentUser()) return cb();
  openModal(`
    <h2>Welcome ✨</h2>
    <p class="sub">Create an account or sign in to continue.</p>
    <div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="authPass" type="password" placeholder="••••••••"></div>
    <button class="btn block" onclick="doLogin()">Sign in</button>
    <button class="btn ghost block mt" onclick="doRegister()">Create account</button>
    <p class="hint center mt">Admin: use ${esc(ADMIN_EMAIL)} (no email verification required).</p>
  `);
}
function doRegister(){
  const email = ($('#authEmail').value||'').trim().toLowerCase();
  const pass  = ($('#authPass').value||'').trim();
  if(!email || !pass){ toast('Email and password required','err'); return; }
  if(state.users.some(u=>u.email.toLowerCase()===email)){ toast('Email already registered','err'); return; }
  const u = {
    id: uid(), email, password: pass,
    username: '', displayName: '', bio: '', avatar: '',
    createdAt: Date.now()
  };
  state.users.push(u);
  state.session = u.id;
  save();
  closeModal();
  toast('Account created 🎉','ok');
  go('profile');
}
function doLogin(){
  const email = ($('#authEmail').value||'').trim().toLowerCase();
  const pass  = ($('#authPass').value||'').trim();
  const u = state.users.find(u=>u.email.toLowerCase()===email);
  if(!u){ toast('No account with that email','err'); return; }
  if(u.password !== pass){ toast('Wrong password','err'); return; }
  state.session = u.id; save(); closeModal();
  toast('Signed in','ok');
  refreshAdminNav();
  go('feed');
}
function logout(){
  state.session = null; save(); closeModal();
  refreshAdminNav();
  toast('Signed out');
  go('feed');
}
function refreshAdminNav(){
  $('#navAdmin').classList.toggle('hidden', !isAdmin());
}

/* =========================================================
   FEED
========================================================= */
function renderFeed(){
  const u = currentUser();
  const albums = [...state.albums].sort((a,b)=>b.createdAt-a.createdAt);
  if(!albums.length){
    $('#feedList').innerHTML=''; $('#feedEmpty').classList.remove('hidden'); return;
  }
  $('#feedEmpty').classList.add('hidden');
  $('#feedList').innerHTML = albums.map(a=>{
    const owner = albumOwner(a);
    if(!owner) return '';
    const liked = userLiked(a.id);
    const cnt = likeCount(a.id);
    const theme = themeById(a.theme);
    const cover = a.photos?.[0]?.src || '';
    return `
      <article class="album-card ${theme.cls}" data-id="${a.id}" onclick="openAlbum('${a.id}')">
        <div class="album-cover">
          ${cover ? `<img src="${cover}" alt="">` : `<div class="fname">✨ ${esc(a.name)}</div>`}
        </div>
        <div class="album-meta">
          <div class="album-row">
            ${avatarHTML(owner,'sm')}
            <div style="flex:1;min-width:0">
              <div class="album-title" style="display:flex;align-items:center;gap:2px;flex-wrap:wrap">
                ${esc(owner.displayName||owner.username||'Anonymous')}${verifiedBadge(owner.id)}
              </div>
              <p class="album-sub">${esc(a.name)} · ${(a.photos||[]).length} photos</p>
            </div>
          </div>
          <div class="album-actions" onclick="event.stopPropagation()">
            <button class="like-btn ${liked?'liked':''}" onclick="toggleLike('${a.id}')">
              <span class="heart">${liked?'♥':'♡'}</span>
              <span class="like-count">${cnt}</span>
            </button>
            <button class="share-btn" onclick="shareAlbum('${a.id}')">↗ Share</button>
          </div>
        </div>
      </article>`;
  }).join('');
}

/* =========================================================
   LIKE
========================================================= */
function toggleLike(albId){
  const u = currentUser();
  if(!u){ requireAuth(()=>{}); return; }
  const idx = state.likes.findIndex(l=>l.albumId===albId && l.userId===u.id);
  if(idx>=0){ state.likes.splice(idx,1); }
  else { state.likes.push({albumId:albId, userId:u.id, at:Date.now()}); }
  save();
  renderFeed();
  if($('#viewer').classList.contains('show')) renderViewerLikes();
}

/* =========================================================
   SHARE
========================================================= */
function shareAlbum(albId){
  const id = albId || currentAlbumId;
  if(!id) return;
  const url = location.origin + location.pathname + '#album=' + id;
  if(navigator.share){
    navigator.share({title:'Rich Albums', url}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(url).then(()=>toast('Link copied','ok')).catch(()=>toast('Copy failed','err'));
  }
}

/* =========================================================
   CREATE
========================================================= */
let selectedTheme = 'romantic';
function renderCreate(){
  const u = currentUser();
  if(!u){ $('#createForm').classList.add('hidden'); $('#createBlocked').classList.remove('hidden');
    $('#createBlocked').innerHTML = `<div class="glass" style="padding:24px;text-align:center">
      <div style="font-size:44px">🔒</div>
      <h2 style="margin:8px 0">Sign in to create</h2>
      <p class="muted" style="margin:0 0 16px;font-size:13px">You need an account first.</p>
      <button class="btn block" onclick="requireAuth(()=>go('profile'))">Sign in / Register</button>
    </div>`;
    return;
  }
  const existing = state.albums.find(a=>a.ownerId===u.id);
  if(existing){
    $('#createForm').classList.add('hidden');
    $('#createBlocked').classList.remove('hidden');
    $('#createBlocked').innerHTML = `<div class="glass" style="padding:24px;text-align:center">
      <div style="font-size:44px">📖</div>
      <h2 style="margin:8px 0">You already have an album</h2>
      <p class="muted" style="margin:0 0 16px;font-size:13px">Delete it first to create a new one.</p>
      <button class="btn block" onclick="openAlbum('${existing.id}')">Open "${esc(existing.name)}"</button>
      <button class="btn ghost block mt" onclick="confirmDeleteAlbum('${existing.id}')" style="color:#ffb3b3">Delete album</button>
    </div>`;
    return;
  }
  // profile completion check
  const missing = [];
  if(!u.avatar) missing.push('profile picture');
  if(!u.username) missing.push('username');
  if(!u.displayName) missing.push('display name');
  if(!u.bio) missing.push('bio');
  if(missing.length){
    $('#createForm').classList.add('hidden');
    $('#createBlocked').classList.remove('hidden');
    $('#createBlocked').innerHTML = `<div class="glass" style="padding:24px;text-align:center">
      <div style="font-size:44px">📝</div>
      <h2 style="margin:8px 0">Complete your profile</h2>
      <p class="muted" style="margin:0 0 8px;font-size:13px">Missing: <b>${missing.join(', ')}</b></p>
      <button class="btn block" onclick="go('profile')">Go to Profile</button>
    </div>`;
    return;
  }
  $('#createBlocked').classList.add('hidden');
  $('#createForm').classList.remove('hidden');
  // theme grid
  $('#themeGrid').innerHTML = THEMES.map(t=>{
    const owned = t.free || (u.themes||[]).includes(t.id);
    return `<div class="theme-opt ${t.cls} ${selectedTheme===t.id?'selected':''}" onclick="pickTheme('${t.id}')">
      ${!t.free ? `<span class="tlock">${owned?'✓':'🔒'}</span>`:''}
      <span class="tname">${esc(t.name)}</span>
    </div>`;
  }).join('');
  $('#albSongCustom').classList.toggle('hidden', $('#albSong').value!=='custom');
}
function pickTheme(id){
  const u = currentUser(); const t = themeById(id);
  if(!t.free && !(u.themes||[]).includes(id)){
    toast('Apply for this theme in Profile → Special Themes','err'); return;
  }
  selectedTheme = id;
  $$('#themeGrid .theme-opt').forEach(el=>el.classList.remove('selected'));
  const all = $$('#themeGrid .theme-opt');
  const idx = THEMES.findIndex(x=>x.id===id);
  if(all[idx]) all[idx].classList.add('selected');
}
function createAlbum(){
  const u = currentUser();
  if(!u){ toast('Sign in first','err'); return; }
  if(state.albums.some(a=>a.ownerId===u.id)){ toast('You already have an album','err'); return; }
  const name = ($('#albName').value||'').trim();
  if(!name){ toast('Album name required','err'); return; }
  let song = $('#albSong').value;
  if(song==='custom') song = ($('#albSongCustom').value||'').trim();
  const intro = $('#albIntro').value;
  const alb = {
    id: uid(), ownerId: u.id, name, theme: selectedTheme,
    song: song || '', intro: intro || '',
    photos: [], createdAt: Date.now()
  };
  state.albums.push(alb); save();
  toast('Album created ✨','ok');
  $('#albName').value=''; $('#albSong').value=''; $('#albSongCustom').value=''; $('#albIntro').value='';
  openAlbum(alb.id);
}

/* =========================================================
   ALBUM VIEWER
========================================================= */
let currentAlbumId = null;
function openAlbum(id){
  const alb = state.albums.find(a=>a.id===id);
  if(!alb){ toast('Album not found','err'); return; }
  currentAlbumId = id;
  const owner = albumOwner(alb);
  $('#viewerTitle').innerHTML = `${esc(alb.name)} ${verifiedBadge(owner?.id||'')}`;
  renderViewer();
  $('#viewer').classList.add('show');
  document.body.style.overflow='hidden';

  if(alb.song) playMusic(alb.song);
  if(alb.intro) playIntro(alb.intro);
}
function closeViewer(){
  $('#viewer').classList.remove('show');
  document.body.style.overflow='';
  stopMusic();
  currentAlbumId = null;
}
function renderViewer(){
  const alb = state.albums.find(a=>a.id===currentAlbumId);
  if(!alb) return;
  const owner = albumOwner(alb);
  const isOwner = currentUser()?.id === alb.ownerId;
  const theme = themeById(alb.theme);
  let photosHTML = (alb.photos||[]).map((p,i)=>`
    <div class="photo-item ${p.frame===false?'no-frame':''}" style="
      transform:rotate(${p.rot||0}deg);
      ${p.frame && p.frame!=='white' ? `border:8px solid ${p.frame};padding:8px;background:#111` : ''}
    ">
      <img src="${p.src}" alt="">
      ${p.caption ? `<div class="caption" style="font-family:${p.font||'Georgia,serif'}">
        ${p.quote?'<span class="quote">“</span>':''}${esc(p.caption)}${p.quote?'<span class="quote">”</span>':''}
      </div>`:''}
      ${isOwner ? `<div style="display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap">
        <button class="mini-btn" onclick="rotatePhoto('${p.id}')">⟲ Rotate</button>
        <button class="mini-btn" onclick="editCaption('${p.id}')">✎ Caption</button>
        <button class="mini-btn" onclick="photoStyle('${p.id}')">🎨 Style</button>
        <button class="mini-btn danger" onclick="deletePhoto('${p.id}')">✕</button>
      </div>`:''}
    </div>
  `).join('');

  if(!photosHTML){
    photosHTML = `<div class="empty"><div class="big">🖼️</div><h3>No photos yet</h3>
      <p>${isOwner?'Add your first photo below.':'This album is still empty.'}</p></div>`;
  }

  $('#viewerBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:6px 0 20px">
      ${avatarHTML(owner,'')}
      <div style="flex:1">
        <div style="font-weight:800;display:flex;align-items:center;gap:2px;flex-wrap:wrap">
          ${esc(displayName(owner))}${verifiedBadge(owner?.id||'')}
        </div>
        <div class="muted" style="font-size:12px">@${esc(owner?.username||'user')}</div>
      </div>
      <button class="like-btn ${userLiked(alb.id)?'liked':''}" onclick="toggleLike('${alb.id}');renderViewer()">
        <span class="heart">${userLiked(alb.id)?'♥':'♡'}</span>
        <span class="like-count">${likeCount(alb.id)}</span>
      </button>
    </div>

    ${photosHTML}

    ${isOwner ? `
      <div class="glass" style="padding:16px;margin-top:20px">
        <div style="font-weight:800;margin-bottom:10px">Add photo</div>
        <input type="file" id="photoFile" accept="image/*" style="margin-bottom:10px;color:var(--muted);font-size:13px">
        <div class="field"><label>Caption (optional)</label><input id="photoCap" placeholder="A romantic note…"></div>
        <div class="field"><label>Font</label>
          <select id="photoFont">
            <option value="Georgia,serif">Georgia (serif)</option>
            <option value="-apple-system,sans-serif">System (sans)</option>
            <option value="'Courier New',monospace">Courier</option>
            <option value="cursive">Cursive</option>
          </select>
        </div>
        <div class="field"><label>Frame</label>
          <select id="photoFrame">
            <option value="">No frame</option>
            <option value="white">White</option>
            <option value="#ffd9e8">Pink</option>
            <option value="#f5c451">Gold</option>
            <option value="#111">Black</option>
          </select>
        </div>
        <button class="btn block" onclick="addPhoto()">Upload photo</button>
      </div>

      <div class="glass" style="padding:16px;margin-top:14px">
        <div style="font-weight:800;margin-bottom:10px">Album settings</div>
        <div class="field"><label>Song URL</label>
          <input id="albSongEdit" value="${esc(alb.song||'')}" placeholder="https://…mp3">
        </div>
        <div class="field"><label>Intro animation</label>
          <select id="albIntroEdit">
            <option value="" ${!alb.intro?'selected':''}>— None —</option>
            <option value="hearts" ${alb.intro==='hearts'?'selected':''}>Floating hearts</option>
            <option value="welcome" ${alb.intro==='welcome'?'selected':''}>Elegant welcome</option>
            <option value="cinematic" ${alb.intro==='cinematic'?'selected':''}>Cinematic fade</option>
          </select>
        </div>
        <div class="field"><label>Theme</label>
          <select id="albThemeEdit">
            ${THEMES.map(t=>{
              const owned = t.free || (currentUser()?.themes||[]).includes(t.id);
              return `<option value="${t.id}" ${alb.theme===t.id?'selected':''} ${!owned?'disabled':''}>${esc(t.name)}${!owned?' 🔒':''}</option>`;
            }).join('')}
          </select>
        </div>
        <button class="btn block" onclick="saveAlbumSettings()">Save changes</button>
        <button class="btn ghost block mt" style="color:#ffb3b3" onclick="confirmDeleteAlbum('${alb.id}')">Delete album</button>
      </div>
    `:''}
  `;
}
function addPhoto(){
  const f = $('#photoFile').files[0];
  if(!f){ toast('Choose an image','err'); return; }
  if(f.size > 6*1024*1024){ toast('Image too big (max 6MB)','err'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const alb = state.albums.find(a=>a.id===currentAlbumId);
    if(!alb) return;
    alb.photos = alb.photos || [];
    alb.photos.push({
      id: uid(),
      src: reader.result,
      caption: ($('#photoCap').value||'').trim(),
      font: $('#photoFont').value,
      frame: $('#photoFrame').value,
      rot: 0
    });
    save(); renderViewer(); renderFeed();
    toast('Photo added ✨','ok');
  };
  reader.readAsDataURL(f);
}
function rotatePhoto(pid){
  const alb = state.albums.find(a=>a.id===currentAlbumId);
  const p = alb?.photos?.find(x=>x.id===pid);
  if(!p) return;
  p.rot = ((p.rot||0) + 15) % 360;
  save(); renderViewer();
}
function editCaption(pid){
  const alb = state.albums.find(a=>a.id===currentAlbumId);
  const p = alb?.photos?.find(x=>x.id===pid);
  if(!p) return;
  openModal(`
    <h2>Edit caption</h2>
    <div class="field"><label>Caption / quote</label>
      <textarea id="capEdit">${esc(p.caption||'')}</textarea>
    </div>
    <button class="btn block" onclick="saveCaption('${pid}')">Save</button>
    <button class="btn ghost block mt" onclick="closeModal()">Cancel</button>
  `);
}
function saveCaption(pid){
  const alb = state.albums.find(a=>a.id===currentAlbumId);
  const p = alb?.photos?.find(x=>x.id===pid);
  if(!p) return;
  p.caption = ($('#capEdit').value||'').trim();
  save(); closeModal(); renderViewer();
}
function photoStyle(pid){
  const alb = state.albums.find(a=>a.id===currentAlbumId);
  const p = alb?.photos?.find(x=>x.id===pid);
  if(!p) return;
  openModal(`
    <h2>Photo style</h2>
    <div class="field"><label>Font</label>
      <select id="stFont">
        <option value="Georgia,serif" ${p.font==='Georgia,serif'?'selected':''}>Georgia</option>
        <option value="-apple-system,sans-serif" ${p.font==='-apple-system,sans-serif'?'selected':''}>Sans</option>
        <option value="'Courier New',monospace" ${p.font==="'Courier New',monospace"?'selected':''}>Courier</option>
        <option value="cursive" ${p.font==='cursive'?'selected':''}>Cursive</option>
      </select>
    </div>
    <div class="field"><label>Frame</label>
      <select id="stFrame">
        <option value="" ${!p.frame?'selected':''}>No frame</option>
        <option value="white" ${p.frame==='white'?'selected':''}>White</option>
        <option value="#ffd9e8" ${p.frame==='#ffd9e8'?'selected':''}>Pink</option>
        <option value="#f5c451" ${p.frame==='#f5c451'?'selected':''}>Gold</option>

/* ---------- avatar crop ---------- */
let cropState = null;
function openAvatarPicker(){
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*';
  input.onchange = () => {
    const f = input.files[0]; if(!f) return;
    if(f.size>8*1024*1024){ toast('Max 8MB','err'); return; }
    const r = new FileReader();
    r.onload = () => openCrop(r.result);
    r.readAsDataURL(f);
  };
  input.click();
}
function openCrop(src){
  cropState = { src, scale:1, x:0, y:0, w:0, h:0 };
  openModal(`
    <h2>Adjust your picture</h2>
    <p class="sub">Drag to position · pinch or slider to zoom</p>
    <div class="crop-stage" id="cropStage">
      <img id="cropImg" src="${src}">
      <div class="crop-ring"></div>
    </div>
    <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" style="width:100%;margin-bottom:14px">
    <button class="btn block" onclick="confirmCrop()">Save</button>
    <button class="btn ghost block mt" onclick="closeModal()">Cancel</button>
  `);
  const img = $('#cropImg');
  const stage = $('#cropStage');
  img.onload = () => {
    const s = stage.getBoundingClientRect();
    const base = Math.max(s.width/img.naturalWidth, s.height/img.naturalHeight);
    cropState.base = base;
    cropState.w = img.naturalWidth; cropState.h = img.naturalHeight;
    applyCrop();
  };
  // drag
  let drag = false, sx=0, sy=0, ox=0, oy=0;
  stage.addEventListener('pointerdown', e=>{ drag=true; sx=e.clientX; sy=e.clientY; ox=cropState.x; oy=cropState.y; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e=>{
    if(!drag) return;
    cropState.x = ox + (e.clientX-sx);
    cropState.y = oy + (e.clientY-sy);
    applyCrop();
  });
  stage.addEventListener('pointerup', ()=>{ drag=false; });
  stage.addEventListener('pointercancel', ()=>{ drag=false; });
  $('#cropZoom').oninput = (e) => { cropState.scale = parseFloat(e.target.value); applyCrop(); };
}
function applyCrop(){
  if(!cropState || !cropState.base) return;
  const img = $('#cropImg');
  const s = cropState.base * cropState.scale;
  img.style.width = (cropState.w * s)+'px';
  img.style.height = (cropState.h * s)+'px';
  img.style.transform = `translate(calc(-50% + ${cropState.x}px), calc(-50% + ${cropState.y}px))`;
}
function confirmCrop(){
  const stage = $('#cropStage');
  const img = $('#cropImg');
  const s = stage.getBoundingClientRect();
  const size = 320;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  // compute source coordinates
  const sc = cropState.base * cropState.scale;
  const dispW = cropState.w * sc, dispH = cropState.h * sc;
  const leftInStage = (s.width/2 - dispW/2) + cropState.x;
  const topInStage  = (s.height/2 - dispH/2) + cropState.y;
  // region of the displayed image that fills the stage
  const srcX = (-leftInStage / sc);
  const srcY = (-topInStage / sc);
  const srcW = s.width / sc;
  const srcH = s.height / sc;
  ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, size, size);
  const dataURL = canvas.toDataURL('image/jpeg', 0.85);
  const u = currentUser();
  if(u){ u.avatar = dataURL; save(); closeModal(); renderProfile(); renderFeed(); toast('Profile picture updated ✨','ok'); }
}

    ${state.albums.map(a=>{
      const boost = state.adminLikes.find(x=>x.albumId===a.id)?.count || 0;
      const real = state.likes.filter(l=>l.albumId===a.id).length;
      return `<div class="list-row">
        <div class="grow"><div class="title">${esc(a.name)}</div>
          <div class="meta">Real: ${real} · Admin: ${boost} · Total: ${likeCount(a.id)}</div></div>
        ${boost>0?`<button class="mini-btn danger" onclick="adminClearLikes('${a.id}')">Clear boost</button>`:''}
      </div>`;
    }).join('')}
  `;
}
function adminAddLikes(){
  const id = $('#alSel').value;
  const n = parseInt($('#alNum').value)||0;
  if(!id || n<=0){ toast('Invalid','err'); return; }
  let rec = state.adminLikes.find(x=>x.albumId===id);
  if(rec) rec.count += n;
  else state.adminLikes.push({albumId:id, count:n});
  save(); renderAdmin(); renderFeed();
  toast(`+${n} likes added`,'ok');
}
function adminClearLikes(id){
  state.adminLikes = state.adminLikes.filter(x=>x.albumId!==id);
  save(); renderAdmin(); renderFeed();
  toast('Admin boost cleared');
}

/* =========================================================
   MODAL / SEARCH / MISC
========================================================= */
function openModal(html){
  $('#modalBody').innerHTML = html;
  $('#modalBack').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeModal(){
  $('#modalBack').classList.remove('show');
  document.body.style.overflow='';
}
function openSearch(){
  openModal(`
    <h2>Search</h2>
    <div class="search-bar"><input id="searchInput" placeholder="Search creators or albums…" oninput="runSearch(this.value)"></div>
    <div id="searchResults"></div>
  `);
  setTimeout(()=>$('#searchInput').focus(), 100);
}
function runSearch(q){
  q = (q||'').trim().toLowerCase();
  const out = $('#searchResults');
  if(!q){ out.innerHTML=''; return; }
  const matchingUsers = state.users.filter(u=>
    (u.username||'').toLowerCase().includes(q) ||
    (u.displayName||'').toLowerCase().includes(q)
  ).slice(0,5);
  const matchingAlbums = state.albums.filter(a=>
    a.name.toLowerCase().includes(q)
  ).slice(0,5);
  out.innerHTML = `
    ${matchingUsers.length?`<div class="muted" style="font-size:12px;margin-bottom:6px">Creators</div>`:''}
    ${matchingUsers.map(u=>`<div class="list-row" onclick="closeModal();openAlbum('${state.albums.find(a=>a.ownerId===u.id)?.id||''}')">
      ${avatarHTML(u,'sm')}
      <div class="grow"><div class="title">${esc(displayName(u))}${verifiedBadge(u.id)}</div><div class="meta">@${esc(u.username||'user')}</div></div>
    </div>`).join('')}
    ${matchingAlbums.length?`<div class="muted" style="font-size:12px;margin:10px 0 6px">Albums</div>`:''}
    ${matchingAlbums.map(a=>`<div class="list-row" onclick="closeModal();openAlbum('${a.id}')">
      <div class="grow"><div class="title">${esc(a.name)}</div><div class="meta">by ${esc(displayName(albumOwner(a)))}</div></div>
    </div>`).join('')}
    ${(!matchingUsers.length && !matchingAlbums.length) ? '<p class="muted center">No results.</p>':''}
  `;
}

   BOOT — seed demo data once, restore session
========================================================= */
function seedDemo(){
  if(DB.get('seeded')) return;
  // demo creator with a beautiful example album
  const demo = {
    id: uid(), email: 'demo@richalbums.app', password: 'demo',
    username: 'aurora', displayName: 'Aurora',
    bio: 'Collector of soft moments ✨',
    avatar: '', createdAt: Date.now()
  };
  state.users.push(demo);
  state.verified.push(demo.id);
  const demoAlb = {
    id: uid(), ownerId: demo.id, name: 'Our Little Universe',
    theme: 'romantic', song: '', intro: 'hearts',
    photos: [],
    createdAt: Date.now()-86400000
  };
  state.albums.push(demoAlb);
  state.adminLikes.push({albumId: demoAlb.id, count: 42});
  // admin account (if not present)
  if(!state.users.some(u=>u.email.toLowerCase()===ADMIN_EMAIL)){
    const admin = {
      id: uid(), email: ADMIN_EMAIL, password: 'admin', // change in production
      username: 'rich', displayName: 'Rich', bio: 'Founder of Rich Albums',
      avatar:'', createdAt: Date.now(), themes: THEMES.filter(t=>!t.free).map(t=>t.id)
    };
    state.users.push(admin);
    state.verified.push(admin.id);
  }
  DB.set('seeded', true);
  save();
}

function boot(){
  seedDemo();
  refreshAdminNav();
  // open album from URL hash
  const m = location.hash.match(/#album=([\w-]+)/);
  go('feed');
  if(m){ setTimeout(()=>openAlbum(m[1]), 400); }
  window.addEventListener('hashchange', ()=>{
    const m = location.hash.match(/#album=([\w-]+)/);
    if(m) openAlbum(m[1]);
  });
}
boot();
</script>
